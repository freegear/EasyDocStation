  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"6b9e2c40-e559-4ce6-a5ab-3aa9eec4f0ac\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>\n  * { box-sizing: border-box; }\n  html, body { margin:0; padding:0; }\n  body { font-family:'굴림', Gulim, 'Malgun Gothic', sans-serif; background:#eef0f3; color:#1f2937; }\n  ::-webkit-scrollbar { height:11px; width:11px; }\n  ::-webkit-scrollbar-track { background:transparent; }\n  ::-webkit-scrollbar-thumb { background:#c3cad4; border-radius:6px; border:2px solid #eef0f3; }\n  .kb-card:active { cursor:grabbing; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh; background:#eef0f3; font-family:'굴림', Gulim, 'Malgun Gothic', sans-serif; color:#1f2937;\">\n\n  <!-- ===================== BOARD VIEW (SCREEN 1) ===================== -->\n  <sc-if value=\"{{ isBoard }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"min-height:100vh; padding-bottom:54px;\">\n\n    <!-- Top bar -->\n    <div style=\"background:#ffffff; border-bottom:2px solid #1e293b;\">\n      <div style=\"display:flex; align-items:center; gap:14px; padding:14px 26px;\">\n        <div style=\"width:42px; height:42px; border-radius:11px; background:#1e293b; color:#fff; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:700; flex:none;\">F<\u002Fdiv>\n        <div style=\"font-size:27px; font-weight:700; color:#1e293b; letter-spacing:-0.5px;\">단계 칸반 보드<\u002Fdiv>\n        <div style=\"display:inline-flex; align-items:center; gap:5px; border:1.6px solid #1e293b; border-radius:9px; padding:6px 12px; font-size:14px; color:#334155; background:#fff;\">▾ 전체 프로젝트<\u002Fdiv>\n        <div style=\"flex:1; max-width:430px; display:flex; align-items:center; gap:8px; border:1.6px solid #cbd5e1; border-radius:10px; padding:8px 13px; color:#94a3b8; font-size:14px; background:#f8fafc;\">\n          <span>🔍<\u002Fspan><span>프로젝트, 고객사, 기술자 검색…<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:inline-flex; align-items:center; border:1.6px solid #1e293b; border-radius:10px; overflow:hidden; font-size:14px;\">\n          <span style=\"padding:7px 14px; background:#1e293b; color:#fff; font-weight:700;\">보드<\u002Fspan>\n          <span style=\"padding:7px 14px; color:#475569;\">리스트<\u002Fspan>\n          <span style=\"padding:7px 14px; color:#475569;\">타임라인<\u002Fspan>\n          <span style=\"padding:7px 14px; color:#475569;\">맵<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"margin-left:auto; display:flex; align-items:center; gap:9px;\">\n          <span style=\"border:1.6px solid #cbd5e1; border-radius:9px; padding:7px 12px; font-size:13px; color:#475569;\">▾ 담당자<\u002Fspan>\n          <span style=\"border:1.6px solid #cbd5e1; border-radius:9px; padding:7px 12px; font-size:13px; color:#475569;\">▾ 우선순위<\u002Fspan>\n          <span style=\"border:1.6px solid #cbd5e1; border-radius:9px; padding:7px 12px; font-size:13px; color:#475569;\">▾ 기간<\u002Fspan>\n          <span style=\"background:#1e293b; color:#fff; border-radius:9px; padding:8px 15px; font-size:14px; font-weight:700;\">+ 새 프로젝트<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Stats -->\n      <div style=\"display:flex; gap:13px; padding:2px 26px 18px; align-items:stretch;\">\n        <div style=\"flex:none; width:130px; border:1.6px solid #1e293b; border-radius:13px; padding:11px 14px; background:#fff;\">\n          <div style=\"font-size:30px; font-weight:700; color:#1e293b; line-height:1;\">47<\u002Fdiv>\n          <div style=\"font-size:13px; color:#64748b; margin-top:5px;\">진행 중 프로젝트<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:none; width:130px; border:1.6px solid #e07a7a; border-radius:13px; padding:11px 14px; background:#fdecec;\">\n          <div style=\"font-size:30px; font-weight:700; color:#c0392b; line-height:1;\">6<\u002Fdiv>\n          <div style=\"font-size:13px; color:#c0392b; margin-top:5px;\">⚠ SLA 지연<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:none; width:130px; border:1.6px solid #1e293b; border-radius:13px; padding:11px 14px; background:#fff;\">\n          <div style=\"font-size:30px; font-weight:700; color:#1e293b; line-height:1;\">3<\u002Fdiv>\n          <div style=\"font-size:13px; color:#64748b; margin-top:5px;\">오늘 완료<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:none; width:130px; border:1.6px solid #1e293b; border-radius:13px; padding:11px 14px; background:#fff;\">\n          <div style=\"font-size:30px; font-weight:700; color:#1e293b; line-height:1;\">12<\u002Fdiv>\n          <div style=\"font-size:13px; color:#64748b; margin-top:5px;\">이번 주 신규 인입<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:none; width:130px; border:1.6px solid #1e293b; border-radius:13px; padding:11px 14px; background:#fff;\">\n          <div style=\"font-size:30px; font-weight:700; color:#1e293b; line-height:1;\">5.2일<\u002Fdiv>\n          <div style=\"font-size:13px; color:#64748b; margin-top:5px;\">평균 리드타임<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:none; width:130px; border:1.6px solid #1e293b; border-radius:13px; padding:11px 14px; background:#fff;\">\n          <div style=\"font-size:30px; font-weight:700; color:#1e293b; line-height:1;\">87%<\u002Fdiv>\n          <div style=\"font-size:13px; color:#64748b; margin-top:5px;\">기술자 가동률<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-left:auto; display:flex; align-items:flex-end; gap:13px;\">\n          <span style=\"font-size:14px; color:#64748b; align-self:center;\">단계 채움률 →<\u002Fspan>\n          <div style=\"display:flex; align-items:flex-end; gap:6px; height:54px;\">\n            <span style=\"width:14px; height:30px; background:#1e293b; border-radius:3px;\"><\u002Fspan>\n            <span style=\"width:14px; height:22px; background:#1e293b; border-radius:3px;\"><\u002Fspan>\n            <span style=\"width:14px; height:42px; background:#1e293b; border-radius:3px;\"><\u002Fspan>\n            <span style=\"width:14px; height:26px; background:#2f6bf2; border-radius:3px;\"><\u002Fspan>\n            <span style=\"width:14px; height:34px; background:#1e293b; border-radius:3px;\"><\u002Fspan>\n            <span style=\"width:14px; height:30px; background:#1e293b; border-radius:3px;\"><\u002Fspan>\n            <span style=\"width:14px; height:20px; background:#1e293b; border-radius:3px;\"><\u002Fspan>\n            <span style=\"width:14px; height:28px; background:#1e293b; border-radius:3px;\"><\u002Fspan>\n            <span style=\"width:14px; height:24px; background:#6cbf8e; border-radius:3px;\"><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Columns -->\n    <div style=\"padding:18px 22px 26px;\">\n      <div style=\"display:flex; gap:22px; align-items:flex-start; width:100%;\">\n        <sc-for list=\"{{ groups }}\" as=\"g\" hint-placeholder-count=\"4\">\n          <div style=\"display:flex; flex-direction:column; gap:12px; flex:{{ g.flex }} 1 0; min-width:0;\">\n            <div style=\"display:flex; justify-content:space-between; align-items:baseline; border-bottom:2px solid #1e293b; padding:0 4px 6px;\">\n              <span style=\"font-size:19px; font-weight:700; color:#1e293b;\">{{ g.name }}<\u002Fspan>\n              <span style=\"font-size:13px; color:#94a3b8; font-style:italic;\">{{ g.marker }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex; gap:10px; align-items:flex-start;\">\n              <sc-for list=\"{{ g.cols }}\" as=\"col\" hint-placeholder-count=\"2\">\n                <div data-col=\"{{ col.idx }}\" style=\"{{ col.style }}\">\n                  <div style=\"padding:11px 11px 8px;\">\n                    <div style=\"display:flex; align-items:center; gap:7px;\">\n                      <span style=\"width:23px; height:23px; border-radius:50%; background:#1e293b; color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex:none;\">{{ col.n }}<\u002Fspan>\n                      <span style=\"font-size:14px; font-weight:700; color:#1e293b; line-height:1.15;\">{{ col.name }}<\u002Fspan>\n                      <span style=\"margin-left:auto; font-size:14px; font-weight:700; color:#64748b;\">{{ col.count }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font-size:11px; color:#94a3b8; margin-top:3px; font-style:italic; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;\">{{ col.sub }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"padding:0 9px 11px; display:flex; flex-direction:column; gap:9px; flex:1;\">\n                    <sc-for list=\"{{ col.cards }}\" as=\"card\" hint-placeholder-count=\"3\">\n                      <div class=\"kb-card\" data-card=\"{{ card.id }}\" onmousedown=\"{{ card.onMouseDown }}\" ontouchstart=\"{{ card.onTouchStart }}\" ondoubleclick=\"{{ card.onOpen }}\" title=\"드래그해서 옆 단계로 이동 · 더블클릭하면 상세화면으로 이동\" style=\"{{ card.style }}\">\n                        <div style=\"font-size:11px; color:#64748b; font-weight:700;\">{{ card.id }}<\u002Fdiv>\n                        <div style=\"font-size:14px; font-weight:700; line-height:1.25; color:#1e293b; margin:2px 0 7px;\">{{ card.title }}<\u002Fdiv>\n                        <div style=\"display:flex; align-items:center; gap:6px; flex-wrap:wrap;\">\n                          <span style=\"font-size:12px; color:#64748b;\">{{ card.company }}<\u002Fspan>\n                          <span style=\"margin-left:auto; display:inline-flex; align-items:center; gap:4px; flex-wrap:wrap; justify-content:flex-end;\">\n                            <sc-for list=\"{{ card.badges }}\" as=\"b\" hint-placeholder-count=\"1\">\n                              <span style=\"{{ b.style }}\">{{ b.text }}<\u002Fspan>\n                            <\u002Fsc-for>\n                          <\u00 nd:#fdf6e3; border:1.5px solid #ecd98a; border-radius:10px; padding:11px 13px; font-size:14px; color:#7a5c00;\">📌 <b>PM 메모:<\u002Fb> {{ d.pmMemo }}<\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- panel 3: activity timeline -->\n          <div style=\"border:1.6px solid #1e293b; border-radius:13px; padding:16px 17px;\">\n            <div style=\"display:flex; align-items:center; gap:8px; margin-bottom:14px;\">\n              <span style=\"font-size:18px; font-weight:700; color:#1e293b;\">활동 타임라인<\u002Fspan>\n              <span style=\"margin-left:auto; font-size:12px; color:#64748b; border:1.4px solid #cbd5e1; border-radius:7px; padding:2px 8px;\">최근 7일<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex; align-items:center; justify-content:space-between; background:#fdecec; border:1.6px solid #e07a7a; border-radius:11px; padding:13px 15px; margin-bottom:16px;\">\n              <div>\n                <div style=\"font-size:26px; font-weight:700; color:#c0392b; line-height:1;\">{{ d.slaTime }}<\u002Fdiv>\n                <div style=\"font-size:12px; color:#c0392b; margin-top:5px;\">SLA 마감까지 (8h 기준)<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:18px; font-weight:700; color:#c0392b;\">{{ d.slaPct }}%<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column;\">\n              <sc-for list=\"{{ d.timeline }}\" as=\"t\" hint-placeholder-count=\"6\">\n                <div style=\"display:flex; gap:11px;\">\n                  <div style=\"display:flex; flex-direction:column; align-items:center;\">\n                    <span style=\"{{ t.dotStyle }}\"><\u002Fspan>\n                    <span style=\"{{ t.lineStyle }}\"><\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"padding-bottom:14px;\">\n                    <div style=\"font-size:14px; font-weight:700; color:#1e293b;\">{{ t.title }}<\u002Fdiv>\n                    <div style=\"font-size:12px; color:#94a3b8; margin-top:1px;\">{{ t.sub }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1480,&quot;height&quot;:900},&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#2f6bf2&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nclass Component extends DCLogic {\n  cols = [\n      { n:1, name:'인입 / ARS',    sub:'Inbound · ARS routing', count:8 },\n      { n:2, name:'STT / 요약',    sub:'Whisper · LLM',         count:5 },\n      { n:3, name:'제안 / 견적',   sub:'LLM 제안서 · PDF',       count:7 },\n      { n:4, name:'매칭 / 스케줄', sub:'기술자 자동매칭',         count:4 },\n      { n:5, name:'알림 / 캘린더', sub:'알림톡 · 동기화',         count:6 },\n      { n:6, name:'현장 검사',     sub:'실측 · 영상',            count:5 },\n      { n:7, name:'계약',          sub:'전자계약 · 서명',         count:3 },\n      { n:8, name:'시공 / 검수',   sub:'Before / After',         count:4 },\n      { n:9, name:'완료 / NPS',    sub:'사후 만족도',            count:5 },\n  ];\n\n  groupDefs = [\n      { name:'스마트 인바운드 & AI', marker:'M1 · MVP',   cols:[0,1,2] },\n      { name:'세일즈 자동화',        marker:'M2 · Phase 2', cols:[3,4] },\n      { name:'현장검사 / 계약',      marker:'M3',         cols:[5,6] },\n      { name:'시공 & 케어',          marker:'M4 · 후속',   cols:[7,8] },\n  ];\n\n  stepDates = ['5/12 · 14:22','5/12 · 14:31','5/15 · 11:08','5/21 · 진행 중','예정','~ 5/24','~ 5/26','~ 6/02','~ 6/04'];\n\n  state = (() => {\n    const P = (id,col,title,company,status,badges)=>({id,col,title,company,status,badges});\n    return {\n      view:'board', selectedId:null, dragId:null, overCol:null, details:{},\n      projects:[\n        P('FS-1042',0,'한솔 아파트 누수 신고','한솔건설',null,[{k:'time',t:'⏱ 4분'},{k:'urgent',t:'긴급 보수','관악교육원','done',[{k:'nps',t:'NPS 9'},{k:'stars',t:'★★★★★'}]),\n        P('FS-0987',8,'성수 카페 외벽 보강','성수상권','done',[{k:'nps',t:'NPS 10'}]),\n        P('FS-0984',8,'하남 미사 신축 점검','하남개발','done',[{k:'nps',t:'NPS 8'}]),\n      ],\n    };\n  })();\n\n  // ---- helpers ----\n  rnd(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }\n  pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }\n\n  accent(){ return this.props.accentColor || '#2f6bf2'; }\n\n  badgeStyle(kind){\n    const pill='display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:8px;line-height:1.55;white-space:nowrap;';\n    switch(kind){\n      case 'urgent': case 'delay': return pill+'background:#fde2e2;color:#c0392b;';\n      case 'blue': return pill+'background:#e3edff;color:#2f6bf2;';\n      case 'done': case 'nps': return pill+'background:#e6f6ec;color:#2f9e5f;';\n      case 'money': return pill+'background:#fef3c7;color:#92600a;';\n      case 'prog': return pill+'background:#e3edff;color:#2f6bf2;';\n      case 'stars': return 'font-size:13px;color:#f5b301;letter-spacing:1px;white-space:nowrap;';\n      case 'avatar': return 'display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:#e2e8f0;color:#334155;font-size:11px;font-weight:700;flex:none;';\n      default: return pill+'background:#f1f5f9;color:#475569;';\n    }\n  }\n\n  cardStyle(st, dragging){\n    const base='border-radius:12px;padding:11px 12px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;'+(dragging?'opacity:0.4;':'');\n    if(st==='delay') return base+'background:#fdecec;border:1.5px solid #e07a7a;';\n    if(st==='done')  return base+'background:#e9f7ee;border:1.5px solid #6cbf8e;';\n    return base+'background:#fff;border:1.4px solid #5b6677;box-shadow:0 1px 0 rgba(0,0,0,0.04);';\n  }\n\n  // ---- mouse/touch drag (React mouse events + native window listeners; bundle-proof) ----\n  beginDrag(x, y, p){\n    this._press = { id:p.id, title:p.title, startX:x, startY:y, dragging:false };\n    if(!this._mm){\n      this._mm = (e)=>this.moveDrag(e.clientX, e.clientY, e);\n      this._mu = (e)=>this.endDrag(e.clientX, e.clientY);\n      this._tm = (e)=>{ const t=e.touches[0]; if(t){ this.moveDrag(t.clientX, t.clientY, e); } };\n      this._tu = (e)=>{ const t=(e.changedTouches&&e.changedTouches[0]); this.endDrag(t?t.clientX:this._lastX, t?t.clientY:this._lastY); };\n    }\n    window.addEventListener('mousemove', this._mm, true);\n    window.addEventListener('mouseup', this._mu, true);\n    window.addEventListener('touchmove', this._tm, {passive:false, capture:true});\n    window.addEventListener('touchend', this._tu, true);\n  }\n\n  detachDrag(){\n    window.removeEventListener('mousemove', this._mm, true);\n    window.removeEventListener('mouseup', this._mu, true);\n    window.removeEventListener('touchmove', this._tm, true);\n    window.removeEventListener('touchend', this._tu, true);\n  }\n\n  moveDrag(x, y, e){\n    const pr = this._press;\n    if(!pr) return;\n    this._lastX = x; this._lastY = y;\n    if(!pr.dragging){\n      if(Math.hypot(x-pr.startX, y-pr.startY) < 6) return;   // below threshold → allow dblclick\n      pr.dragging = true;\n      this.setState({ dragId: pr.id });\n    }\n    if(e && e.cancelable) e.preventDefault();\n    this.setState({ ghostX:x, ghostY:y, overCol:this.colAtPoint(x,y) });\n  }\n\n  endDrag(x, y){\n    const pr = this._press;\n    this._press = null;\n    this.detachDrag();\n    if(!pr || !pr.dragging) return;                          // simple click → do nothing\n    const overCol = this.colAtPoint(x, y);\n    if(overCol!=null){\n      this.setState(s=>({\n        projects: s.projects.map(p=>p.id===pr.id ? {...p, col:overCol} : p),\n        dragId:null, overCol:null\n      }));\n    } else {\n      this.setState({ dragId:null, overCol:null });\n    }\n  }\n\n  colAtPoint(x, y){\n    const el = document.elementFromPoint(x, y);\n    if(!el || !el.closest) return null;\n    const colEl = el.closest('[data-col]');\n    if(!colEl) return null;\n    const n = parseInt(colEl.getAttribute('data-col'), 10);\n    return isNaN(n) ? null : n;\n  }\n\n  // ---- detail ----\n  openDetail(id){\n    this.setState(s=>{\n      const details={...s.details};\n      if(!details[id]){\n        const p=s.projects.find(x=>x.id===id);\n        details[id]=this.genDetail(p);\n      }\n      return { view:'detail', selectedId:id, details, dragId:null, overCol:null };\n    });\n  }\n\n  genDetail(p){\n    const r=this.rnd.bind(this), pk=this.pick.bind(this);\n    const names=['박상민','최영도','김태호','이정훈','한승우','조민기','윤재호','서동현','강민수','노태석'];\n    const regions=['강남','서초','송파','강동','분당','일산','마포','용산'];\n    const skills=['방수1급','옥상작업','외벽보수','균열보수','배관전문','실측·드론'];\n    const addresses=['서울 강남구 테헤란로 152','서울 서초구 반포대로 58','경기 성남시 분당구 판교로 230','인천 중구 공항로 271','부산 해운대구 센텀로 45','서울 마포구 월드컵북로 400'];\n    const pms=['이경수','김도현','박지훈','최수민','한예린','정우성'];\n    const summaries=['옥상 방수층 노후화 → 부분 재시공 필요','지하 배관 누수 → 누수 위치 탐지 필요','외벽 균열 다수 → 정밀 진단 권장','지붕 우수 유입 → 방수 보강 필요'];\n\n    const usedN=new Set(); const cand=[];\n    for(let i=0;i<3;i++){\n      let nm; do{nm=pk(names);}while(usedN.has(nm)); usedN.add(nm);\n      const tag = i===0 ? {t:'매칭 적합',k:'green'} : (i===2 && Math.random()<0.6 ? {t:'충돌',k:'red'} : {t:'검토',k:'gray'});\n      const a=r(22,27), b=a+r(2,4);\n      cand.push({\n        name:nm, initial:nm[0], rating:'★ '+ (r(44,50)/10).toFixed(1),\n        desc: pk(regions)+' · '+pk(skills)+ (tag.k==='red' ? ' · 일정 겹침 5/'+r(23,28) : ' · 가용 5/'+a+'-5/'+b),\n        tag:tag.t, tagKind:tag.k\n      });\n    }\n\n    const stageIdx=p.col;\n    const steps=this.cols.map((c,i)=>({\n      n:c.n, name:c.name,\n      status: i<stageIdx?'done':(i===stageIdx?'current':'todo'),\n      date: this.stepDates[i]\n    }));\n\n    const tlPool=[\n      {title:cand[0].name+' 매칭 후보 확정 대기', sub:'방금 · AI 매칭 엔진'},\n      {title:'기술자 '+r(2,4)+'명 자동 매칭 완료', sub:r(8,30)+'분 전 · system'},\n      {title:'고객 견적 승인', sub:r(1,3)+'시간 전 · '+p.company+' 김부장'},\n      {title:'제안서 v'+r(1,3)+' 발송', sub:r(1,3)+'일 전 · 영업팀'},\n      {title:'LLM 견적서 자동 생성', sub:r(2,4)+'일 전 · 견적 엔진'},\n      {title:'STT 요약 & To-Do 추출', sub:'5/12 · AI 파이프라인'},\n      {title:'ARS 1번 → 상담사 인입', sub:'5/12 '+r(10,17)+':'+r(10,59)+' · 인입'},\n    ];\n\n    const group = this.groupDefs.find(g=>g.cols.includes(stageIdx));\n\n    return {\n      groupName: group ? group.name : '세일즈 자동화',\n      address: pk(addresses),\n      budget: '₩' + (r(8,120)*1000000).toLocaleString('en-US'),\n      manager: pk(pms),\n      team: '+'+r(2,4),\n      priorityLabel: pk(['우선순위 높음','우선순위 보통','우선순위 긴급']),\n      vip: Math.random()<0.6,\n      inDate: '5/'+r(9,14),\n      dueDate: '6/0'+r(1,8),\n      stageIdx,\n      stageNum: stageIdx+1,\n      stageLeft: 9-(stageIdx+1),\n      stageName: this.cols[stageIdx].name,\n      stageBadge: ['①','②','③','④','⑤','⑥','⑦','⑧','⑨'][stageIdx],\n      steps,\n      stayTime: r(1,8)+'h '+r(10,59)+'m',\n      slaText: 'SLA '+r(3,9)+'h 까지',\n      progressPct: Math.min(98, Math.round(((stageIdx+ (r(2,7)/10))/9)*100)),\n      qualific: pk(['방수 1급 · 옥상작업 경력 3년+','외벽보수 2급 · 고소작업 가능','균열보수 전문 · 진단 경력 5년+']),\n      region: pk(regions)+' / '+pk(regions)+' (반경 '+r(5,12)+'km)',\n      duration: r(2,6)+'일 · 2026-05-'+r(20,24)+' ~ 05-'+r(25,29),\n      matchResult: r(2,4)+'명 추천 · '+r(1,2)+'명 확정대기',\n      candidates: cand,\n      callSummary: pk(summaries),\n      custPriority: pk(['P0 · 본사 전산실 상부','P1 · 임원동 옥상','P0 · 데이터센터 인접']),\n      proposalPdf: '견적서_v'+r(1,3)+'.pdf',\n      checkDone: 3,\n      checklist:[\n        {text:'고객 견적 승인 회신 수신', checked:true},\n        {text:'권역 / 작업 난이도 자동 분류', checked:true},\n        {text:'필요 자재 표준단가 매핑', checked:true},\n        {text:'기술자 자격증 만료일 검증', checked:false},\n        {text:'현장 안전 점검 일정 협의', checked:false},\n      ],\n      slaTime: r(1,4)+'h '+r(10,59)+'m',\n      slaPct: r(45,88),\n      timeline: tlPool,\n      pmMemo: pk(['옥상 접근 사다리차 필요','지하 단수 협의 후 진행','드론 촬영 기상 확인 필요','자재 입고 일정 재확인','현장 안전교육 사전 실시']),\n      photos: [],\n    };\n  }\n\n  triggerPhoto(){ if(this.fileInput) this.fileInput.click(); }\n\n  onFileChange(e){\n    const files=Array.from(e.target.files||[]);\n    files.forEach(f=>{\n      const reader=new FileReader();\n      reader.onload=ev=>{\n        const url=ev.target.result;\n        this.setState(s=>{\n          const details={...s.details};\n          const d={...details[s.selectedId]};\n          d.photos=[...(d.photos||[]), {url, id:Date.now()+Math.random()}];\n          details[s.selectedId]=d;\n          return {details};\n        });\n      };\n      reader.readAsDataURL(f);\n    });\n    e.target.value='';\n  }\n\n  removePhoto(pid){\n    this.setState(s=>{\n      const details={...s.details};\n      const d={...details[s.selectedId]};\n      d.photos=(d.photos||[]).filter(x=>x.id!==pid);\n      details[s.selectedId]=d;\n      return {details};\n    });\n  }\n\n  buildDetail(det, accent){\n    const cur=det.stageIdx;\n    const steps=det.steps.map(s=>{\n      let circleStyle, labelStyle;\n      const baseC='width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex:none;';\n      if(s.status==='done'){ circleStyle=baseC+'background:#1e293b;color:#fff;border:3px solid #1e293b;'; labelStyle='font-size:14px;font-weight:700;color:#1e293b;text-align:center;'; }\n      else if(s.status==='current'){ circleStyle=baseC+'background:'+accent+';color:#fff;border:3px solid '+accent+';box-shadow:0 0 0 4px '+accent+'33;'; labelStyle='font-size:14px;font-weight:700;color:'+accent+';text-align:center;'; }\n      else { circleStyle=baseC+'background:#fff;color:#94a3b8;border:3px solid #cbd5e1;'; labelStyle='font-size:14px;font-weight:700;color:#94a3b8;text-align:center;'; }\n      return { n:s.n, name:s.name, date:s.date, isCurrent:s.status==='current', mark: s.status==='done' ? '✓' : String(s.n), circleStyle, labelStyle };\n    });\n    const lineWidth='calc((100% - 48px) * '+(cur/8)+')';\n\n    const candidates=det.candidates.map(c=>{\n      const tagMap={ green:'background:#e6f6ec;color:#2f9e5f;', gray:'background:#f1f5f9;color:#475569;', red:'background:#fde2e2;color:#c0392b;' };\n      const cardSel = c.tagKind==='red' ? 'border:1.5px solid #e2e8f0;background:#fbfbfc;opacity:0.85;' : (c.tagKind==='green' ? 'border:1.6px solid #6cbf8e;background:#f3fbf6;' : 'border:1.5px solid #cbd5e1;background:#fff;');\n      return { initial:c.initial, name:c.name, rating:c.rating, desc:c.desc, tag:(c.tagKind==='green'?'✓ ':'')+c.tag,\n        cardStyle:'border-radius:11px;padding:11px 12px;'+cardSel,\n        tagStyle:'flex:none;font-size:12px;font-weight:700;border-radius:8px;padding:3px 10px;'+(tagMap[c.tagKind]||tagMap.gray) };\n    });\n\n    const checklist=det.checklist.map(ck=>({\n      text:ck.text,\n      mark: ck.checked ? '✓' : '',\n      boxStyle:'width:20px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none;'+(ck.checked?'background:'+accent+';color:#fff;border:1.5px solid '+accent+';':'background:#fff;color:transparent;border:1.6px solid #cbd5e1;'),\n      textStyle:'font-size:14px;'+(ck.checked?'color:#1e293b;font-weight:700;':'color:#64748b;')\n    }));\n\n    const labels=['옥상 전경','방수층 균열','배수구 주변'];\n    const photoTiles=[];\n    (det.photos||[]).forEach(ph=>photoTiles.push({ isImage:true, isEmpty:false, url:ph.url, onRemove:()=>this.removePhoto(ph.id) }));\n    for(let i=photoTiles.length; i<3; i++){ photoTiles.push({ isImage:false, isEmpty:true, label:labels[i]||'사진' }); }\n\n    const timeline=det.timeline.map((t,i)=>({\n      title:t.title, sub:t.sub,\n      dotStyle:'width:13px;height:13px;border-radius:50%;flex:none;margin-top:3px;'+(i===0?'background:'+accent+';box-shadow:0 0 0 3px '+accent+'33;':'background:#1e293b;'),\n      lineStyle: i===det.timeline.length-1 ? 'width:0;' : 'width:2px;flex:1;background:#e2e8f0;margin-top:2px;'\n    }));\n\n    return {\n      id:this.state.selectedId,\n      title:(this.state.projects.find(p=>p.id===this.state.selectedId)||{}).title,\n      company:(this.state.projects.find(p=>p.id===this.state.selectedId)||{}).company,\n      groupName:det.groupName, address:det.address, budget:det.budget, manager:det.manager, team:det.team,\n      priorityLabel:det.priorityLabel, vip:det.vip, inDate:det.inDate, dueDate:det.dueDate,\n      stageNum:det.stageNum, stageLeft:det.stageLeft, stageName:det.stageName, stageBadge:det.stageBadge,\n      stayTime:det.stayTime, slaText:det.slaText, progressPct:det.progressPct,\n      steps, lineWidth,\n      qualific:det.qualific, region:det.region, duration:det.duration, matchResult:det.matchResult,\n      candidates,\n      checkDone:det.checkDone, callSummary:det.callSummary, custPriority:det.custPriority, proposalPdf:det.proposalPdf,\n      checklist,\n      photoCount:(det.photos||[]).length, photoTiles,\n      slaTime:det.slaTime, slaPct:det.slaPct, timeline, pmMemo:det.pmMemo,\n      triggerPhoto:()=>this.triggerPhoto(), onFileChange:(e)=>this.onFileChange(e),\n      setFileRef:(el)=>{ this.fileInput=el; },\n    };\n  }\n\n  renderVals(){\n    const accent=this.accent();\n    const { projects, view, selectedId, details, overCol }=this.state;\n    const byCol=i=>projects.filter(p=>p.col===i);\n\n    const groups=this.groupDefs.map(g=>({\n      name:g.name, marker:g.marker, flex:g.cols.length,\n      cols:g.cols.map(ci=>{\n        const meta=this.cols[ci];\n        const cards=byCol(ci).map(p=>({\n          id:p.id, title:p.title, company:p.company,\n          badges:(p.badges||[]).map(b=>({ text:b.t, style:this.badgeStyle(b.k) })),\n          style:this.cardStyle(p.status, this.state.dragId===p.id),\n          onMouseDown:(e)=>{ if(e.button!=null && e.button!==0) return; this.beginDrag(e.clientX, e.clientY, p); },\n          onTouchStart:(e)=>{ const t=e.touches[0]; if(t) this.beginDrag(t.clientX, t.clientY, p); },\n          onOpen:()=>this.openDetail(p.id),\n        }));\n        const moreCount=Math.max(0, meta.count-cards.length);\n        return {\n          idx:ci,\n          n:meta.n, name:meta.name, sub:meta.sub, count:meta.count,\n          cards, hasMore:moreCount>0, moreCount,\n          style:'flex:1 1 0;min-width:0;background:'+(overCol===ci?accent+'14':'#fbfbfc')+';border:2px solid '+(overCol===ci?accent:'#1e293b')+';border-radius:13px;min-height:520px;display:flex;flex-direction:column;transition:border-color .12s,background .12s;',\n        };\n      })\n    }));\n\n    let d=null;\n    if(view==='detail' && selectedId && details[selectedId]){\n      d=this.buildDetail(details[selectedId], accent);\n    }\n\n    let dragCard=null;\n    if(this.state.dragId!=null){ dragCard=projects.find(p=>p.id===this.state.dragId); }\n    const ghost = {\n      show: !!dragCard,\n      id: dragCard ? dragCard.id : '',\n      title: dragCard ? dragCard.title : '',\n      style: 'position:fixed; left:0; top:0; transform:translate(' + ((this.state.ghostX||0)+14) + 'px,' + ((this.state.ghostY||0)+10) + 'px); width:240px; background:#fff; border:2px solid '+accent+'; border-radius:12px; padding:11px 12px; box-shadow:0 12px 28px rgba(15,23,42,0.28); pointer-events:none; z-index:9999; rotate:-2deg;'\n    };\n\n    return {\n      isBoard: view==='board',\n      isDetail: view==='detail',\n      groups, d, ghost,\n      backToBoard:()=>this.setState({view:'board', dragId:null, overCol:null}),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
